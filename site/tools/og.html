<!doctype html>
<!-- The link-preview image (public/og.jpg). Open at 1200x630 and take a screenshot, e.g. with Playwright:
     page.setViewportSize({ width: 1200, height: 630 }); page.goto('file:///.../site/tools/og.html'); page.screenshot(...) -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
      @font-face { font-family: 'Inter'; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #06070c; }
      .bg { position: absolute; inset: 0; background: url('../public/img/hero.webp') 70% 55% / 135% auto no-repeat; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(6 7 12 / 0.97) 0%, rgb(6 7 12 / 0.85) 38%, rgb(6 7 12 / 0.05) 70%); }
      .copy { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 560px; color: #eef0f6; }
      .brand { display: flex; align-items: center; gap: 14px; font: 600 34px 'Space Grotesk'; letter-spacing: -0.01em; }
      .brand svg { width: 48px; height: 48px; filter: drop-shadow(0 0 12px rgb(139 92 246 / 0.8)); }
      h1 { margin: 34px 0 0; font: 600 84px/0.95 'Space Grotesk'; letter-spacing: -0.045em; }
      p { margin: 24px 0 0; font: 400 26px/1.35 'Inter'; color: #b8bfd0; }
      .chip { margin-top: 34px; align-self: flex-start; font: 600 20px 'Inter'; color: white; padding: 10px 22px; border-radius: 999px; background: linear-gradient(100deg, #ff3cac, #8b5cf6 50%, #22d3ee); }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="shade"></div>
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3CAC" /><stop offset="0.5" stop-color="#8B5CF6" /><stop offset="1" stop-color="#22D3EE" /></linearGradient></defs><rect x="96" y="136" width="320" height="240" rx="40" fill="none" stroke="url(#g)" stroke-width="56" /></svg>
        Backbloom
      </div>
      <h1>Play beyond the screen.</h1>
      <p>Your lights follow your screen. Ambient lighting &amp; game immersion for Windows.</p>
      <span class="chip">Free &amp; open source</span>
    </div>
  </body>
</html>
