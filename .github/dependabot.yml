# Minor and patch updates come grouped, one pull request per area; a major version comes on its own, since it usually
# needs code changes, except for packages that only work at the same version (vitest and its plugins, React and its
# types), which come together. Updates of the UI's production dependencies, Tailwind or the app's NuGet packages change
# the bundled licenses: run packaging/Update-ThirdPartyNotices.ps1 on the branch and commit the result (CI checks it,
# so such a pull request fails until then).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      # Packages of the .NET release itself follow the target framework (net10.0, the LTS release): their next major
      # comes with the move to the next .NET, not on its own.
      - dependency-name: 'Microsoft.Data.Sqlite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'System.*'
        update-types: ['version-update:semver-major']
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      # a dependency goes to the first group it matches, so these come first
      vitest:
        patterns: ['vitest', '@vitest/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      ui-dev:
        dependency-type: development
        update-types: [minor, patch]
      ui-prod:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
