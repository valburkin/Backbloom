# Minor and patch updates come grouped, one pull request per area; a major version comes on its own, since it usually
# needs code changes. Updates of the UI's production dependencies or Tailwind change the bundled licenses: run
# packaging/Update-ThirdPartyNotices.ps1 on the branch (CI checks it).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly }
    groups:
      nuget:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      ui-dev:
        dependency-type: development
        update-types: [minor, patch]
      ui-prod:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
